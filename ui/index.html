<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>diffdeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='20' height='20' rx='5' fill='%23C9D2F6'/%3E%3Crect x='9' y='3' width='20' height='20' rx='5' fill='%233451D1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="20" height="20" rx="5" fill="#C9D2F6"/><rect x="9" y="3" width="20" height="20" rx="5" fill="#3451D1"/></svg>
        <span>diffdeck</span>
      </div>
      <span class="source-chip" id="source-chip"></span>
      <div class="topbar-spacer"></div>
      <span class="save-state" id="save-state" aria-live="polite"></span>
      <div class="progress" id="progress" title="Cards reviewed"></div>
      <button class="btn btn-primary" id="handoff-btn" type="button">
        Finish review <span class="count-badge" id="handoff-count" hidden></span>
      </button>
    </div>
  </header>

  <main class="page" id="page">
    <div class="loading">Loading review…</div>
  </main>

  <div class="sheet-backdrop" id="sheet" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Finish review"></aside>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/graph.js"></script>
  <script src="/app.js"></script>
</body>
</html>
